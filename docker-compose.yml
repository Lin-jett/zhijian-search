# 知鉴Search 一键部署（任务 A3）
# 用法：
#   export ZHIHU_TOKEN=xxx           # 可选，hybrid/live 需要
#   export LLM_API_KEY=xxx           # 可选，api 模式需要
#   docker compose up -d --build     # 进程守护：restart: always 崩了自动拉起
#   docker compose logs -f backend
#
# 密钥全部通过环境变量传入，compose 文件本身不含任何明文密钥（A3 要求）。
services:
  backend:
    build: .
    restart: always                 # 进程守护：崩溃自动重启（A3 第4条）
    ports:
      - "8000:8000"                 # 生产建议只对 127.0.0.1 暴露，交给前置 Nginx
    environment:
      ZHIJIAN_DATA_MODE: ${ZHIJIAN_DATA_MODE:-hybrid}
      ZHIJIAN_LLM_MODE: ${ZHIJIAN_LLM_MODE:-api}
      ZHIHU_TOKEN: ${ZHIHU_TOKEN:-}
      ZHIHU_API_BASE: ${ZHIHU_API_BASE:-https://openapi.zhihu.com}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
