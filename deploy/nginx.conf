# 知鉴Search 后端 Nginx 反代 + HTTPS 配置（任务 A3）
#
# 作用：
#   - 对外只暴露 443（HTTPS），前端从 https 页面调本服务不会被浏览器拦（A3 第1条）。
#   - 反代到本机 uvicorn 127.0.0.1:8000。
#   - CORS 已在 FastAPI 层 allow_origins=["*"] 放开（A3 第2条），此处不再重复加头。
#
# 证书：用 certbot 一键签发（Let's Encrypt）：
#   sudo certbot --nginx -d your-domain.example.com
# certbot 会自动改写本文件补上 ssl_certificate 两行并配置自动续期。

server {
    listen 80;
    server_name your-domain.example.com;
    # HTTP 全量跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.example.com;

    # 下面两行由 certbot 自动填入：
    # ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    # 一次检索 4-6 秒，前端设 8s 超时；反代超时放到 15s 留余量
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
